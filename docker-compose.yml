name: epl_forecast

x-database-url: &database-url postgresql+psycopg://${POSTGRES_USER:-epl}:${POSTGRES_PASSWORD:-epl}@db:5432/${POSTGRES_DB:-epl}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-epl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-epl}
      POSTGRES_DB: ${POSTGRES_DB:-epl}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./backend
    image: epl_forecast_backend
    command: alembic upgrade head
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy

  pipeline:
    build: ./backend
    image: epl_forecast_backend
    command: python -m pipeline.run all
    environment:
      DATABASE_URL: *database-url
      DATA_DIR: /data
      FOOTBALL_DATA_TOKEN: ${FOOTBALL_DATA_TOKEN:-}
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  ml:
    build: ./backend
    image: epl_forecast_backend
    command: python -m ml.build_features
    environment:
      DATABASE_URL: *database-url
      MODELS_DIR: /models
    volumes:
      - ./models:/models
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
