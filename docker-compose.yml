name: epl_forecast

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-epl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-epl}
      POSTGRES_DB: ${POSTGRES_DB:-epl}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./backend
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-epl}:${POSTGRES_PASSWORD:-epl}@db:5432/${POSTGRES_DB:-epl}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
